<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="$csp">
<title>$title</title>
<style>
$colors
body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font-family: $font; }
#samovar-chart { width: 100%; height: 60vh; min-height: 360px; border: 1px solid var(--border); border-radius: ${radius}px; background: var(--bg); }
details { margin-top: 16px; }
summary { cursor: pointer; color: var(--muted); }
table { border-collapse: collapse; font-size: 12px; margin-top: 8px; }
th, td { border: 1px solid var(--border); padding: 2px 8px; text-align: left; }
pre { background: var(--surface); border: 1px solid var(--border); border-radius: ${radius}px; padding: 8px; overflow-x: auto; font-family: $mono; }
footer { margin-top: 12px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div id="samovar-chart" role="img" aria-label="$title"></div>
<details><summary>Данные</summary><table><thead><tr>$head</tr></thead><tbody>$body</tbody></table>$more</details>
<details><summary>SQL</summary><pre>$sql</pre></details>
<footer>$footer</footer>
<script type="application/json" id="samovar-payload">$payload</script>
<script>$bundle</script>
<script>$bootstrap</script>
</body>
</html>
